<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numune Listesi</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f1ec;
    color: #2b2620;
    padding-bottom: 40px;
  }
  header {
    background: #6b4226;
    color: #fff;
    padding: 14px 16px;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  header h1 { margin: 0; font-size: 18px; }
  .tabs {
    display: flex;
    gap: 6px;
    margin-top: 10px;
  }
  .tab-btn {
    flex: 1;
    border: none;
    border-radius: 8px;
    padding: 8px 6px;
    font-size: 13px;
    font-weight: 600;
    background: rgba(255,255,255,0.18);
    color: #fff;
  }
  .tab-btn.active {
    background: #fff;
    color: #6b4226;
  }
  .stats {
    padding: 10px 16px 4px;
    font-size: 13px;
    color: #6b5c44;
  }
  .list { padding: 6px 12px; }
  .row {
    background: #fff;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .row.sent {
    background: #eef7ea;
  }
  .row.sent .name {
    text-decoration: line-through;
    color: #7a8c6e;
  }
  .row-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .name { font-size: 15px; font-weight: 600; flex: 1; word-break: break-word; }
  .check-btn {
    border: none;
    border-radius: 18px;
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .check-btn.not-sent { background: #ece0d0; color: #7a6a52; }
  .check-btn.sent { background: #4a8c3a; color: #fff; }
  .field-label {
    font-size: 11px;
    color: #9a8c74;
    margin-top: 10px;
    margin-bottom: 3px;
    font-weight: 600;
  }
  .phone-input, .addr-input {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #ddd4c5;
    font-size: 14px;
    background: #fcfbf8;
    font-family: inherit;
  }
  .addr-input {
    resize: vertical;
    min-height: 54px;
    line-height: 1.4;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }
  .del-btn {
    border: none;
    background: none;
    color: #b8776a;
    font-size: 12px;
    margin-top: 8px;
    padding: 4px 0;
  }
  .empty {
    text-align: center;
    color: #9a8c74;
    font-size: 14px;
    padding: 30px 10px;
  }
  .add-box {
    background: #fff;
    border-radius: 10px;
    padding: 14px;
    margin: 10px 12px 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .add-box input, .add-box textarea {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #ddd4c5;
    font-size: 14px;
    margin-bottom: 8px;
    font-family: inherit;
  }
  .add-box textarea {
    resize: vertical;
    min-height: 50px;
  }
  .add-submit {
    width: 100%;
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    font-weight: 600;
    background: #6b4226;
    color: #fff;
  }
</style>
</head>
<body>

<header>
  <h1>📦 Numune Gönderim Takibi</h1>
  <div class="tabs">
    <button class="tab-btn active" data-tab="active" id="tabActiveBtn">Bekleyenler</button>
    <button class="tab-btn" data-tab="sent" id="tabSentBtn">Geçmiş (Gönderildi)</button>
  </div>
</header>
<div class="stats" id="stats"></div>

<div id="addBoxWrap"></div>
<div class="list" id="list"></div>

<script>
const seedNames = [
"Esko Bilal abi","Emc","Ahmet kaya turgutlu","Çınar ticaret","Diyar Mehmet Marmaris",
"Mehmet abi Urla","Metin Kıbrıs","Mtc Marmaris","Mya ibrahim","Nasıl abi denizli",
"Narlidere yasin toptan","Oral abi Tokel","Retro nargile","Shelby tobacco Ferit",
"Sinan bey lüle","Suma zafer kibris","Sultan nargile Burak","Usame avcı",
"m.t.s Hookah Amasya","Cls nargile instagram","Dogu nargile instagram",
"Hck nargile Store instagram","Hugo nargile shop instagram","Demirhan nargile instagram",
"Turbo nargile instagram","Alfe shisha official","Oruç tobacco","Olimpos tobacco",
"Aksihar tobacco","Makru Hookah","Asya nargile toptan","Duhan tobacco shop",
"Nargilecim askin tobacco","Şah nargile","Ceyran","Tokel","Beyrok a s","Bahrin nargile",
"Mix tobacco shop","Yigit nargile güneşli","Lab coffe hookah"
];

// Yeni veri anahtari (eski v2 verisiyle karismasin, eski adres/telefon karisik
// yazilmis olabilecegi icin ayri bir yapiya geciyoruz. Eski veriyi de asagida
// bir kerelik gostererek yeni alanlara tasiyoruz.)
const KEY = 'numune-liste-v3';
const OLD_KEY = 'numune-liste-basit-v2';

let items = [];   // {id, name, phone, addr, sent}
let currentTab = 'active';

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      items = JSON.parse(raw);
      return;
    }
  } catch (e) { /* ignore */ }

  // ilk kurulum: eski veriyi varsa oku ve tasi, yoksa isim listesinden olustur
  let oldState = {};
  try {
    const oldRaw = localStorage.getItem(OLD_KEY);
    if (oldRaw) oldState = JSON.parse(oldRaw);
  } catch (e) { /* ignore */ }

  items = seedNames.map((n, i) => {
    const old = oldState['n' + i] || {};
    return {
      id: 'n' + i,
      name: n,
      phone: '',
      addr: old.addr || '',
      sent: !!old.sent
    };
  });
  save();
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(items)); }
  catch (e) { console.error(e); }
}

function uid() {
  return 'x' + Date.now() + Math.floor(Math.random() * 1000);
}

function renderAddBox() {
  const wrap = document.getElementById('addBoxWrap');
  if (currentTab !== 'active') { wrap.innerHTML = ''; return; }
  wrap.innerHTML = `
    <div class="add-box">
      <div class="field-label">Yeni Kayıt Ekle</div>
      <input id="newName" type="text" placeholder="Ad Soyad / Firma">
      <input id="newPhone" type="tel" placeholder="Telefon">
      <textarea id="newAddr" placeholder="Adres"></textarea>
      <button class="add-submit" id="addBtn">+ Ekle</button>
    </div>
  `;
  document.getElementById('addBtn').addEventListener('click', () => {
    const name = document.getElementById('newName').value.trim();
    const phone = document.getElementById('newPhone').value.trim();
    const addr = document.getElementById('newAddr').value.trim();
    if (!name) { document.getElementById('newName').focus(); return; }
    items.unshift({ id: uid(), name, phone, addr, sent: false });
    save();
    render();
  });
}

function render() {
  document.getElementById('tabActiveBtn').classList.toggle('active', currentTab === 'active');
  document.getElementById('tabSentBtn').classList.toggle('active', currentTab === 'sent');

  renderAddBox();

  const list = document.getElementById('list');
  list.innerHTML = '';

  const shown = items.filter(it => currentTab === 'active' ? !it.sent : it.sent);
  const sentCount = items.filter(it => it.sent).length;

  if (shown.length === 0) {
    list.innerHTML = `<div class="empty">${currentTab === 'active' ? 'Bekleyen kayıt yok 🎉' : 'Henüz gönderilen kayıt yok'}</div>`;
  }

  shown.forEach(item => {
    const row = document.createElement('div');
    row.className = 'row' + (item.sent ? ' sent' : '');
    row.innerHTML = `
      <div class="row-top">
        <div class="name">${escapeHtml(item.name)}</div>
        <button class="check-btn ${item.sent ? 'sent' : 'not-sent'}" data-id="${item.id}">
          ${item.sent ? '↩ Geri Al' : '✓ Gönderildi'}
        </button>
      </div>
      <div class="field-label">Telefon</div>
      <input class="phone-input" type="tel" data-id="${item.id}" data-field="phone" placeholder="Telefon numarası" value="${escapeAttr(item.phone || '')}">
      <div class="field-label">Adres</div>
      <textarea class="addr-input" data-id="${item.id}" data-field="addr" placeholder="Adres">${escapeHtml(item.addr || '')}</textarea>
      <button class="del-btn" data-id="${item.id}">🗑 Kaydı Sil</button>
    `;
    list.appendChild(row);
  });

  list.querySelectorAll('.check-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const it = items.find(x => x.id === btn.dataset.id);
      it.sent = !it.sent;
      save();
      render();
    });
  });

  list.querySelectorAll('.phone-input, .addr-input').forEach(inp => {
    inp.addEventListener('input', () => {
      const it = items.find(x => x.id === inp.dataset.id);
      it[inp.dataset.field] = inp.value;
      clearTimeout(inp._t);
      inp._t = setTimeout(save, 400);
    });
  });

  list.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!confirm('Bu kaydı silmek istediğine emin misin?')) return;
      items = items.filter(x => x.id !== btn.dataset.id);
      save();
      render();
    });
  });

  document.getElementById('stats').textContent =
    `Toplam: ${items.length} · Gönderildi: ${sentCount} · Bekliyor: ${items.length - sentCount}`;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeAttr(s) {
  return escapeHtml(s).replace(/"/g,'&quot;');
}

document.getElementById('tabActiveBtn').addEventListener('click', () => { currentTab = 'active'; render(); });
document.getElementById('tabSentBtn').addEventListener('click', () => { currentTab = 'sent'; render(); });

load();
render();
</script>

</body>
</html>
